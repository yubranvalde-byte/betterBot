services:
  - type: web
    name: betterbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: FAST_MODEL
        value: gemini-4-hydrogen
      - key: COMPILER_MODEL
        value: gemini-4-argon
      - key: DECISION_MODEL
        value: gemini-decision-1
      - key: DB_PATH
        value: betterbot_history.db
      - key: MASTER_WORKSPACE_KEY
        sync: false
